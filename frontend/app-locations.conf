# Shared by the HTTP and HTTPS server blocks so the two can never drift apart.
# Included from nginx.conf (port 80) and nginx-tls.conf (port 443).
#
# Note: every proxy_pass below forwards Host as $http_host rather than $host.
# $host drops the port, which breaks the backend's same-origin check whenever
# the site is served on a non-default port (an Origin of
# "https://192.168.1.5:8443" would be compared against a Host of
# "192.168.1.5" and rejected).

root /usr/share/nginx/html;
index index.html;

client_max_body_size 20M;

# ------------------------
# HEALTH CHECK
# ------------------------
# Exposed for load balancers and uptime monitoring. Reports only
# ok/degraded, no internal detail.
location = /healthz {
    proxy_pass http://backend:8080/healthz;
    proxy_set_header Host $http_host;
    access_log off;
}

# ------------------------
# SERVICE WORKER
# ------------------------
# Must never be served stale: a cached service worker keeps an old push
# handler alive across deploys.
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
}

# ------------------------
# AUTH ROUTES
# ------------------------
location ~ ^/(login|register)$ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ------------------------
# API + WEBSOCKET
# ------------------------
location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_connect_timeout 60;
}

# ------------------------
# REACT ROUTING
# ------------------------
location / {
    try_files $uri /index.html;
}
