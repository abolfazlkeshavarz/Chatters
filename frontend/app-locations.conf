# Shared by the HTTP and HTTPS server blocks so the two can never drift apart.
# Included from nginx.conf (port 80) and nginx-tls.conf (port 443).
#
# Note: every proxy_pass below forwards Host as $http_host rather than $host.
# $host drops the port, which breaks the backend's same-origin check whenever
# the site is served on a non-default port (an Origin of
# "https://192.168.1.5:8443" would be compared against a Host of
# "192.168.1.5" and rejected).

root /usr/share/nginx/html;
index index.html;

# Default ceiling for everything that is not an upload endpoint.
client_max_body_size 20M;

# A bare "proxy_pass http://backend:8080" resolves the hostname once, when
# nginx starts, and caches it for the container's life. That is invisible to
# "docker compose up --scale backend=N": nginx would keep sending every
# request to whichever single replica existed at startup, so scaling would do
# nothing. Routing through a variable instead forces nginx to re-resolve via
# this resolver — Docker's embedded DNS — on the interval below, which is what
# lets it actually spread requests across replicas as they come and go.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend "backend:8080";

# ------------------------
# HEALTH CHECK
# ------------------------
# Exposed for load balancers and uptime monitoring. Reports only
# ok/degraded, no internal detail.
location = /healthz {
    proxy_pass http://$backend/healthz;
    proxy_set_header Host $http_host;
    access_log off;
}

# ------------------------
# SERVICE WORKER
# ------------------------
# Must never be served stale: a cached service worker keeps an old push
# handler alive across deploys.
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
}

# ------------------------
# APP SHELL CACHING
# ------------------------
# The HTML names the current hashed bundle, so it must be revalidated on every
# load: a copy an installed PWA held on to would point at files a new deploy
# has already removed, and the "new version" prompt could never show up. The
# manifest is included for the same reason. The hashed files under /static/
# never change for a given name, so they can be cached for good.
location = /index.html {
    add_header Cache-Control "no-cache";
}
location = /manifest.json {
    add_header Cache-Control "no-cache";
}
location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# ------------------------
# AUTH ROUTES
# ------------------------
location ~ ^/(login|register)$ {
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ------------------------
# UPLOAD ENDPOINTS
# ------------------------
# Body size is enforced by the backend, not here, because the limit depends on
# who is asking: administrators upload without a cap, everyone else is held to
# MAX_UPLOAD_BYTES. nginx cannot tell the two apart — it never sees the bearer
# token's claims — so a fixed ceiling here would reject an admin's large upload
# with a 413 before the application ever got the chance to allow it.
#
# "0" disables nginx's own check only; the request is still streamed straight
# to the backend, which applies http.MaxBytesReader per role.
location ~ ^/api/(media|files)$ {
    client_max_body_size 0;
    proxy_request_buffering off;

    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A multi-gigabyte upload over a slow link must not trip the default
    # 60-second send timeout partway through.
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
}

# ------------------------
# API + WEBSOCKET
# ------------------------
location /api/ {
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_connect_timeout 60;
}

# ------------------------
# REACT ROUTING
# ------------------------
location / {
    try_files $uri /index.html;
}
