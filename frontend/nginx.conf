server {
    listen 80;
    server_name _;

    # Note: every proxy_pass below forwards Host as $http_host rather than
    # $host. $host drops the port, which breaks the backend's same-origin
    # check whenever the site is served on a non-default port (an Origin of
    # "http://example.com:8080" would be compared against a Host of
    # "example.com" and rejected).

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # ------------------------
    # HEALTH CHECK
    # ------------------------
    # Exposed for load balancers and uptime monitoring. Reports only
    # ok/degraded, no internal detail.
    location = /healthz {
        proxy_pass http://backend:8080/healthz;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # ------------------------
    # AUTH ROUTES
    # ------------------------
    location ~ ^/(login|register)$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ------------------------
    # API + WEBSOCKET
    # ------------------------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;
    }

    # ------------------------
    # REACT ROUTING
    # ------------------------
    location / {
        try_files $uri /index.html;
    }
}
