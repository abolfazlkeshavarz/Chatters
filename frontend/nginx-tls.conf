# TLS server block, mounted over the default one by docker-compose.https.yml.
#
# This exists so notifications and end-to-end encryption can be exercised from
# a phone on the local network. Service workers and Web Crypto are gated behind
# a secure context, and a LAN IP over plain HTTP is not one.
#
# The certificate must be trusted by the device, not merely present: browsers
# refuse to register a service worker when the certificate fails validation,
# even after the user clicks through the warning. Generate one with
# scripts/gen-certs.sh, which uses mkcert.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    include /etc/nginx/app-locations.conf;
}

# Plain HTTP stays available on 80 so `make lan` style access and the
# container healthcheck keep working; it is not redirected, because the
# HTTP and HTTPS ports are published separately in local testing.
server {
    listen 80;
    server_name _;

    include /etc/nginx/app-locations.conf;
}
