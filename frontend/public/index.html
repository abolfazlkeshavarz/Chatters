<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />

    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!--
      viewport-fit=cover lets the layout extend under the iPhone notch and home
      indicator; the CSS then pads content back with env(safe-area-inset-*).
      maximum-scale is intentionally omitted: capping zoom breaks accessibility
      for anyone who needs to enlarge text.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#007aff" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Chatters — private messaging with optional end-to-end encryption"
    />

    <!-- iOS standalone PWA: required for Home Screen install and Web Push -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chatters" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Chatters</title>

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
