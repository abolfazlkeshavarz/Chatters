# Pinned explicitly rather than left to default to the checkout directory's
# name: Compose namespaces every container, network and volume by project
# name, so on a server that also runs other Docker projects, an implicit name
# is one `git clone` into a differently-named folder away from colliding with
# something else. Pinning it here means that can never happen, regardless of
# what the directory is called.
name: chatters

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-messenger}
    volumes:
      # The schema is created and kept up to date by the backend's migrations
      # on every boot, so there is no init script to fall out of sync with.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatters} -d ${POSTGRES_DB:-messenger}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional in the code (every caller falls back to in-memory, single-process
  # behaviour without it) but included by default here because it is what
  # makes `docker compose up --scale backend=N` actually work: it shares rate
  # limits and WebSocket tickets across replicas, and carries the Pub/Sub that
  # lets a message reach a recipient connected to a different replica than the
  # sender. See HELP.md's "Scaling out" section.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./Chatters
      args:
        # Go module mirror, for a network where proxy.golang.org is slow or
        # blocked. Empty/unset in .env falls through to Go's real defaults.
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-chatters}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      DB_NAME: ${POSTGRES_DB:-messenger}
      DB_SSLMODE: disable

      REDIS_URL: redis://redis:6379/0

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - run "make env" then edit .env}
      GIN_MODE: release
      PORT: 8080

      # Extra browser origins allowed to call the API. Same-origin requests are
      # always permitted, so this is only needed for a split-domain setup.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}

      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}

      # Web Push. Generate with: make vapid
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-admin@example.com}

      # Creates (or promotes) this administrator on boot. Idempotent: an
      # existing account is promoted, never overwritten.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}

      # Voice calls (WebRTC). The apps get these as ICE servers from
      # GET /api/calls/ice-servers; see the coturn service below.
      STUN_URLS: ${STUN_URLS:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - uploads:/app/private_uploads
    healthcheck:
      test: ["CMD", "/app/chatters-server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # TURN relay for voice calls. Most phones sit behind carrier NAT that
  # blocks direct peer-to-peer audio; TURN relays it (still encrypted end to
  # end by WebRTC — coturn only sees SRTP packets). Off unless enabled with
  # COMPOSE_PROFILES=calls in .env.
  #
  # Host networking because TURN needs a large UDP port range, which Docker's
  # port publishing handles badly. Open in the firewall: 3478/udp+tcp and
  # the relay range (TURN_MIN_PORT-TURN_MAX_PORT)/udp.
  coturn:
    image: coturn/coturn:4.6
    profiles: ["calls"]
    restart: unless-stopped
    network_mode: host
    # Checked here, at container start, rather than with compose's ${VAR:?}
    # syntax: compose evaluates that even when the "calls" profile is off,
    # which would break `docker compose up` on every server without calls.
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      # The address coturn binds and relays on. Defaults to TURN_EXTERNAL_IP,
      # which is right when the public IP sits on the server's interface.
      # Behind 1:1 NAT (some clouds), set it to the private interface IP.
      TURN_RELAY_IP: ${TURN_RELAY_IP:-}
      TURN_REALM: ${TURN_REALM:-chatters}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49260}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -n "$$TURN_SECRET" ] || { echo "coturn: TURN_SECRET is empty - run 'make secrets'"; exit 1; }
        [ -n "$$TURN_EXTERNAL_IP" ] || { echo "coturn: set TURN_EXTERNAL_IP to this server's public IP in .env"; exit 1; }
        RELAY="$${TURN_RELAY_IP:-$$TURN_EXTERNAL_IP}"
        # Bind only the real address (plus loopback for local tests), not
        # every Docker bridge network on the host.
        exec turnserver -n --log-file=stdout --listening-port=3478 --fingerprint \
          --listening-ip="$$RELAY" --listening-ip=127.0.0.1 --relay-ip="$$RELAY" \
          --use-auth-secret --static-auth-secret="$$TURN_SECRET" --realm="$$TURN_REALM" \
          --external-ip="$$TURN_EXTERNAL_IP" --min-port="$$TURN_MIN_PORT" --max-port="$$TURN_MAX_PORT" \
          --no-cli --no-tls --no-dtls --no-multicast-peers \
          --user-quota=4 --total-quota=200 \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255

  frontend:
    build:
      context: ./frontend
      args:
        # npm registry mirror, for a network where registry.npmjs.org is slow
        # or blocked. Empty/unset in .env falls through to npm's real default.
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-127.0.0.1:8082}:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads:
