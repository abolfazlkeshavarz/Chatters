# Builds the ChattersApp Android APK on a GitHub runner and uploads it as a
# downloadable artifact. Runs the compile on the runner itself (`--local`), so
# it works from networks where EAS Build's upload endpoint is blocked.
#
# Requires:
#   - repo secret EXPO_TOKEN  (expo.dev -> Access Tokens); used to fetch the
#     Android signing keystore that EAS already generated for this project
#   - ChattersApp/app.json + eas.json committed with the real projectId and the
#     EXPO_PUBLIC_API_BASE you want baked in (the `preview` profile is used)
#
# Trigger it from the Actions tab -> "Build Android APK" -> Run workflow.
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        working-directory: ChattersApp
        run: npm install

      - name: Build APK on the runner
        working-directory: ChattersApp
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          eas build
          --platform android
          --profile preview
          --local
          --non-interactive
          --output app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chatters-android-apk
          path: ChattersApp/app-release.apk
          if-no-files-found: error
