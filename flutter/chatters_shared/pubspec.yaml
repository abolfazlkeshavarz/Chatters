name: chatters_shared
description: Shared Flutter code for the Chatters Android and iOS apps.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.2
  pointycastle: ^3.9.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  connectivity_plus: ^6.0.5
  flutter_local_notifications: ^18.0.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
